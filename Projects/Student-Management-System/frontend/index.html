<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage student records efficiently</p>
    </header>

    <main>

        <section class="dashboard">
            <h2>Dashboard</h2>

            <div class="stat-card">
                <h3>Total Students</h3>
                <p id="studentCount">0</p>
            </div>
        </section>

        <section class="student-form">

            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="form-group">
                    <label for="studentName">Full Name</label>
                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student's full name"
                        required
                    >
                </div>
                

                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter student ID"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentEmail">Email</label>
                    <input
                        type="email"
                        id="studentEmail"
                        placeholder="Enter student email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentProgram">Program</label>
                    <input
                        type="text"
                        id="studentProgram"
                        placeholder="Enter program"
                        required
                    >
                </div>

                <button type="submit">Add Student</button>

            </form>

        </section>

        <div class="search-section">
            <input
                type="text"
                id="searchInput"
                placeholder="Search students..."
            >
        </div>

        <section class="student-records">

            <h2>Student Records</h2>

            <table>

                <thead>
    <tr>
        <th>Student ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Program</th>
        <th>Action</th>
    </tr>
</thead>
                <tbody id="studentTableBody">

                    <tr>
                        <td colspan="4">
                            No students registered yet.
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <footer>
        <p>Student Management System | Information Technology Management</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
